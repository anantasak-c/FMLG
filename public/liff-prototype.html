<!doctype html>
<!-- THROWAWAY UI PROTOTYPE: Three LINE MINI App (LIFF) entry layouts, switchable with ?variant=A|B|C. -->
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FOMOlogy LIFF — UI Prototype</title>
  <style>
    :root { --ink:#070809; --panel:#121416; --line:#292d2b; --lime:#b9ff4a; --orange:#ff6b2c; --muted:#9aa09b; --paper:#f6f7f4; }
    * { box-sizing:border-box; } body { margin:0; background:#dfe3de; color:#f8faf7; font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans Thai",sans-serif; }
    button { font:inherit; cursor:pointer; } .shell { min-height:100dvh; max-width:430px; margin:auto; background:var(--ink); overflow:hidden; padding-bottom:88px; position:relative; }
    .top { display:flex; justify-content:space-between; align-items:center; padding:15px 18px 12px; position:sticky; top:0; z-index:5; background:linear-gradient(#070809 72%,transparent); }
    .brand { display:flex; gap:9px; align-items:center; font-weight:900; letter-spacing:.04em; font-size:13px; } .brand img { width:32px; height:32px; object-fit:cover; border-radius:10px; } .brand small { display:block; font-size:8px; color:var(--lime); letter-spacing:.16em; margin-top:1px; }
    .coin { border:1px solid rgba(185,255,74,.35); color:var(--lime); padding:7px 10px; border-radius:999px; background:rgba(185,255,74,.08); font-size:12px; font-weight:800; }
    .screen { padding:0 16px 22px; } .eyebrow { color:var(--lime); font-size:10px; font-weight:900; letter-spacing:.12em; } h1 { margin:8px 0; font-size:28px; letter-spacing:-.04em; line-height:1.15; } p { margin:0; color:#c5cac4; font-size:13px; line-height:1.55; }
    .hero { min-height:212px; border:1px solid #29302a; border-radius:24px; overflow:hidden; position:relative; padding:24px 20px; display:flex; align-items:flex-end; background:#111; margin:8px 0 18px; }.hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:70% center; opacity:.68; }.hero:after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,#070809 8%,rgba(7,8,9,.75) 45%,rgba(7,8,9,.06)); }.hero div { position:relative; z-index:1; max-width:230px; }.hero h1 { font-size:25px; }
    .section-title { display:flex; justify-content:space-between; align-items:end; margin:18px 2px 10px; }.section-title b { font-size:15px; }.section-title span { color:var(--muted); font-size:11px; }
    .intent-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }.intent { text-align:left; overflow:hidden; border:1px solid #30352f; background:#151817; color:white; border-radius:17px; padding:0; }.intent.active { border-color:var(--lime); box-shadow:0 0 0 1px rgba(185,255,74,.35); }.intent img { width:100%; height:92px; object-fit:cover; display:block; }.intent div { padding:10px 11px 12px; }.intent strong { display:block; font-size:13px; }.intent small { color:#abb1ab; font-size:10px; display:block; margin-top:3px; }
    .market-search { display:flex; gap:7px; margin:12px 0; }.market-search input { min-width:0; flex:1; border:1px solid #363d37; background:#151916; color:white; border-radius:13px; padding:11px 12px; outline:0; }.market-search button { border:0; border-radius:13px; padding:0 14px; background:var(--lime); color:#111; font-weight:900; }.market-filters { display:flex; gap:7px; overflow:auto; padding-bottom:3px; scrollbar-width:none; }.market-filters::-webkit-scrollbar { display:none; }.market-filters button { flex:0 0 auto; border:1px solid #343b35; border-radius:999px; padding:8px 11px; background:#151916; color:#dfe5de; font-size:10px; font-weight:800; }.market-filters button.active { background:var(--lime); color:#101308; border-color:var(--lime); }.market-list { display:grid; gap:12px; margin-top:14px; }.market-card { overflow:hidden; border:1px solid #303630; background:#141715; border-radius:18px; }.market-media { height:166px; position:relative; overflow:hidden; background:#000; }.market-media img { width:100%; height:100%; object-fit:cover; }.market-media:after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 45%,rgba(0,0,0,.9)); }.market-price { position:absolute; z-index:1; top:10px; left:10px; padding:6px 9px; border-radius:999px; background:var(--orange); color:#fff; font-size:9px; font-weight:950; }.market-price.free { background:var(--lime); color:#111; }.market-save { position:absolute; z-index:2; top:9px; right:9px; width:34px; height:34px; border:1px solid rgba(255,255,255,.25); border-radius:50%; background:rgba(0,0,0,.68); color:white; font-size:17px; }.market-title { position:absolute; z-index:1; bottom:12px; left:13px; right:13px; font-size:15px; font-weight:950; }.market-body { padding:12px; }.market-body p { font-size:11px; }.market-actions { display:flex; gap:7px; margin-top:11px; }.market-actions button { flex:1; border:0; border-radius:12px; padding:11px 8px; font-size:11px; font-weight:950; }.market-actions .unlock { background:var(--lime); color:#111; }.market-actions .share { flex:0 0 40px; background:#212521; color:#fff; border:1px solid #363c36; }
    .primary { width:100%; border:0; border-radius:16px; background:var(--lime); color:#101308; padding:15px; font-weight:950; font-size:14px; margin-top:14px; }.primary:active { transform:scale(.98); }.soft { border:1px solid #353b36; border-radius:13px; padding:11px; background:#151817; color:white; font-weight:800; font-size:12px; }
    .tabs { position:absolute; bottom:0; inset-inline:0; height:70px; border-top:1px solid #252b26; background:rgba(7,8,9,.96); display:flex; justify-content:space-around; align-items:center; padding-bottom:max(5px,env(safe-area-inset-bottom)); }.tabs button { border:0; background:transparent; color:#8c948d; font-size:10px; display:grid; gap:3px; place-items:center; }.tabs button b { font-size:18px; line-height:18px; }.tabs button.active { color:var(--lime); }
    .chat-head { background:linear-gradient(135deg,#1d2713,#10130d 60%,#19120d); border:1px solid #354426; border-radius:20px; padding:16px; display:flex; gap:12px; align-items:center; }.orb { width:44px; height:44px; border-radius:50%; background:radial-gradient(circle at 60% 40%,#f6ffce 0 8%,var(--lime) 11% 34%,#25300f 36% 51%,var(--lime) 53% 57%,#111 60%); box-shadow:0 0 24px rgba(185,255,74,.35); flex:0 0 auto; }.chat-head b { display:block; font-size:14px; }.chat-head small { color:#c8d6b8; font-size:11px; display:block; margin-top:3px; }.thread { display:grid; gap:11px; padding:19px 1px; }.bubble { max-width:83%; padding:12px 13px; border-radius:15px 15px 15px 4px; font-size:13px; line-height:1.5; background:#202421; border:1px solid #303730; }.bubble.user { margin-left:auto; border-radius:15px 15px 4px 15px; background:var(--lime); color:#101308; border:0; font-weight:700; }.chips { display:flex; gap:7px; overflow:auto; padding-bottom:2px; }.chips button { flex:0 0 auto; border:1px solid #3b443c; border-radius:999px; padding:8px 10px; color:#e8eee7; background:#161a17; font-size:11px; }.composer { border:1px solid #3a413b; background:#151916; padding:8px; border-radius:16px; display:flex; align-items:center; gap:8px; }.composer input { min-width:0; flex:1; border:0; outline:0; background:transparent; color:white; font-size:13px; }.send { background:var(--lime); border:0; border-radius:11px; width:38px; height:36px; font-size:18px; }
    .timeline { padding-left:13px; border-left:2px solid #333b33; display:grid; gap:12px; margin:18px 0; }.draft { position:relative; background:#151917; border:1px solid #303630; border-radius:16px; padding:14px; }.draft:before { content:""; width:9px; height:9px; background:var(--lime); position:absolute; left:-19px; top:19px; border-radius:50%; box-shadow:0 0 0 4px #070809; }.draft.orange:before { background:var(--orange); }.draft b { display:block; font-size:13px; }.draft p { font-size:11px; margin-top:4px; }.draft footer { display:flex; align-items:center; justify-content:space-between; margin-top:11px; color:var(--lime); font-weight:800; font-size:11px; }.new-draft { border:1px dashed #606a5d; background:linear-gradient(135deg,#1a2117,#111410); border-radius:20px; padding:18px; }.new-draft h2 { margin:0 0 5px; font-size:18px; }.mode-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }.mode-row button { padding:10px 5px; color:#e9eee8; border:1px solid #3a413b; background:#191d1a; border-radius:13px; font-size:10px; font-weight:800; }.mode-row button b { display:block; font-size:17px; margin-bottom:3px; }
    .switcher { position:fixed; bottom:12px; left:50%; translate:-50% 0; z-index:40; display:flex; align-items:center; gap:7px; background:#f6f7f4; color:#151815; border:1px solid #c2c8be; box-shadow:0 8px 25px rgba(0,0,0,.38); border-radius:999px; padding:6px; }.switcher button { border:0; border-radius:50%; width:31px; height:31px; background:#151815; color:var(--lime); font-size:17px; }.switcher span { min-width:170px; text-align:center; line-height:1.2; }.switcher span b { display:block; font-size:10px; }.switcher span small { display:block; color:#646a64; font-size:8px; margin-top:2px; }.toast { position:fixed; left:50%; top:72px; translate:-50% -8px; z-index:50; background:var(--lime); color:#111; border-radius:999px; padding:9px 13px; opacity:0; pointer-events:none; font-size:11px; font-weight:900; transition:.2s; white-space:nowrap; }.toast.show { opacity:1; translate:-50% 0; }
    .light { background:#e2e7e0; }.light .shell { background:var(--paper); color:#111710; }.light .top { background:linear-gradient(var(--paper) 72%,transparent); }.light .brand { color:#151915; }.light .coin { color:#426400; background:#edf6d6; border-color:#b3dc62; }.light p { color:#5d655d; }.light .section-title span { color:#707970; }.light .intent { color:#171c16; background:#fff; border-color:#d9dfd7; }.light .intent small { color:#667067; }.light .intent.active { border-color:#83b923; }.light .market-search input { background:#fff; border-color:#d2d9d0; color:#172016; }.light .market-filters button { background:#fff; color:#3b4439; border-color:#d5dcd3; }.light .market-filters button.active { background:#151915; color:#fff; }.light .market-card { background:#fff; border-color:#d8ded6; }.light .market-actions .share { background:#f1f3ef; color:#222; border-color:#d7dcd5; }.light .soft { color:#1b2219; background:#fff; border-color:#d7ddd5; }.light .chat-head { background:linear-gradient(135deg,#e4f1ce,#f6f9f0 60%,#fff5e9); border-color:#c4db9c; }.light .chat-head small { color:#596a47; }.light .bubble { background:#fff; color:#1b211a; border-color:#d8ded7; }.light .bubble.user { background:var(--lime); }.light .chips button { color:#283023; background:#fff; border-color:#d4dbd2; }.light .composer { background:#fff; border-color:#cfd7cd; }.light .composer input { color:#1b211a; }.light .timeline { border-color:#cbd4c8; }.light .draft { background:#fff; border-color:#d8ded7; }.light .draft:before { box-shadow:0 0 0 4px var(--paper); }.light .new-draft { background:linear-gradient(135deg,#edf5e4,#fff); border-color:#a9b9a1; }.light .mode-row button { color:#1f281d; border-color:#ccd5c9; background:#fff; }.light .tabs { background:rgba(246,247,244,.96); border-color:#d8ded6; }.light .tabs button { color:#697368; }.light .tabs button.active { color:#5e9307; }
    @media (min-width:600px) { body { padding:18px; } .shell { min-height:820px; border-radius:28px; box-shadow:0 24px 70px rgba(0,0,0,.28); } }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>
  <main id="app"></main>
  <nav class="switcher" aria-label="Prototype variant switcher"><button onclick="cycle(-1)" aria-label="Previous variant">←</button><span id="variant-label"></span><button onclick="cycle(1)" aria-label="Next variant">→</button></nav>
  <script>
    const intents = {
      product: ['ขายสินค้า', 'ทำให้สินค้าเด่นและน่าลอง', './artwork/starter-product.webp'],
      review: ['รีวิวร้าน', 'พาคนดูเห็นแล้วอยากมา', './artwork/starter-review.webp'],
      story: ['เล่าเรื่อง', 'เล่าเรื่องให้คนดูรู้สึกตาม', './artwork/starter-story.webp'],
      knowledge: ['คลิปความรู้', 'อธิบายเรื่องยากให้เข้าใจง่าย', './artwork/starter-knowledge.webp']
    };
    const marketItems = [
      { id:'food', title:'อาหารไทยน่ากินใน 15 วินาที', category:'ขายสินค้า', price:0, tier:'ใช้ฟรี', image:'./artwork/starter-product.webp', detail:'โชว์จุดขายเร็ว พร้อม CTA สั้น ๆ' },
      { id:'cafe', title:'รีวิวคาเฟ่ให้คนอยากตามมา', category:'รีวิวร้าน', price:15, tier:'Basic', image:'./artwork/starter-review.webp', detail:'บรรยากาศ มุมเด่น และพิกัดในคลิปเดียว' },
      { id:'brand', title:'เล่าเรื่องแบรนด์เล็กให้คนจำ', category:'เล่าเรื่อง', price:35, tier:'Pro', image:'./artwork/starter-story.webp', detail:'โครงเรื่อง 3 ช่วง พร้อม mood และจังหวะกล้อง' },
      { id:'knowledge', title:'คลิปความรู้ เข้าใจง่ายใน 30 วิ', category:'คลิปความรู้', price:15, tier:'Basic', image:'./artwork/starter-knowledge.webp', detail:'Hook อธิบาย และสรุปสิ่งที่นำไปใช้ได้' },
      { id:'service', title:'โปรโมตบริการให้ดูน่าเชื่อถือ', category:'บริการ', price:35, tier:'Pro', image:'./artwork/studio-radar-frame.webp', detail:'ปัญหา วิธีช่วย หลักฐาน และนัดหมาย' },
      { id:'campaign', title:'Campaign เปิดตัวสินค้า 3 ขนาด', category:'โปรโมชัน', price:75, tier:'Campaign', image:'./artwork/ai-coach-radar-hero.webp', detail:'พร้อมแนวตั้ง จัตุรัส และแนวนอน' }
    ];
    const variants = { A: 'A · Explore Marketplace', B: 'B · Coach-first Chat', C: 'C · My Work Timeline' };
    const state = { variant: new URLSearchParams(location.search).get('variant') || 'A', intent: 'product', tab: 'Explore', theme: 'dark', coins:745, marketFilter:'ทั้งหมด', marketSearch:'', saved:new Set(['cafe']), owned:new Set(['food']) };
    if (!variants[state.variant]) state.variant = 'A';
    const brand = () => `<header class="top"><div class="brand"><img src="./fomology-logo.jpg" alt="FOMOlogy"><span>FOMOLOGY<small>AI VIDEO RADAR</small></span></div><div style="display:flex;gap:7px"><button class="soft" style="padding:7px 9px" onclick="toggleTheme()" aria-label="สลับ Light mode">${state.theme==='dark'?'☀️':'🌙'}</button><button class="coin" onclick="notice('Wallet ใน LIFF: แสดงยอดแบบสั้น')">🪙 ${state.coins}</button></div></header>`;
    const tabs = (active) => `<nav class="tabs"><button class="${active==='Explore'?'active':''}" onclick="setTab('Explore')"><b>⌂</b>Explore</button><button class="${active==='Coach'?'active':''}" onclick="setTab('Coach')"><b>◉</b>Coach</button><button class="${active==='งานของฉัน'?'active':''}" onclick="setTab('งานของฉัน')"><b>▣</b>งานของฉัน</button><button class="${active==='ฉัน'?'active':''}" onclick="setTab('ฉัน')"><b>☺</b>ฉัน</button></nav>`;
    const intentCards = () => `<div class="intent-grid">${Object.entries(intents).map(([key,[title,detail,image]])=>`<button class="intent ${state.intent===key?'active':''}" onclick="chooseIntent('${key}')"><img src="${image}" alt="${title}"><div><strong>${title}</strong><small>${detail}</small></div></button>`).join('')}</div>`;
    function variantA() { const term=state.marketSearch.toLowerCase(); const items=marketItems.filter(item=>(state.marketFilter==='ทั้งหมด'||state.marketFilter==='ใช้ฟรี'&&item.price===0||state.marketFilter==='บันทึกไว้'&&state.saved.has(item.id)||item.category===state.marketFilter)&&(!term||`${item.title} ${item.category} ${item.detail}`.toLowerCase().includes(term))); return `<div class="shell">${brand()}<section class="screen"><span class="eyebrow">EXPLORE · PROMPT MARKETPLACE</span><h1>หาไอเดีย แล้วเริ่มสร้าง</h1><p>Template ที่ทีมคัด ทั้งแบบใช้ฟรีและ Prompt Pack</p><div class="market-search"><input id="market-search" value="${state.marketSearch}" onkeydown="if(event.key==='Enter') applyMarketSearch()" placeholder="ค้นหา รีวิวร้าน, ขายอาหาร..."><button onclick="applyMarketSearch()">ค้นหา</button></div><div class="market-filters">${['ทั้งหมด','ใช้ฟรี','ขายสินค้า','รีวิวร้าน','คลิปความรู้','บริการ','บันทึกไว้'].map(filter=>`<button class="${state.marketFilter===filter?'active':''}" onclick="setMarketFilter('${filter}')">${filter}</button>`).join('')}</div><div class="section-title"><b>${state.marketFilter}</b><span>${items.length} ไอเดีย</span></div><div class="market-list">${items.map(item=>{const saved=state.saved.has(item.id);const owned=item.price===0||state.owned.has(item.id);return `<article class="market-card"><div class="market-media"><img src="${item.image}" alt="${item.title}"><span class="market-price ${item.price===0?'free':''}">${item.price===0?'ใช้ฟรี':`${item.tier} · ${item.price} Coins`}</span><button class="market-save" onclick="toggleMarketSaved('${item.id}')">${saved?'★':'☆'}</button><div class="market-title">${item.title}</div></div><div class="market-body"><p>${item.detail}</p><div class="market-actions"><button class="unlock" onclick="${owned?`useMarketItem('${item.id}')`:`buyMarketItem('${item.id}')`}">${owned?(item.price===0?'ใช้ไอเดียนี้ →':'เปิดใช้อีกครั้ง →'):`ปลดล็อก · ${item.price} Coins`}</button><button class="share" onclick="notice('แชร์ลิงก์ผ่าน LINE')">↗</button></div></div></article>`;}).join('')}</div></section>${tabs('Explore')}</div>`; }
    function variantB() { const [title] = intents[state.intent]; return `<div class="shell">${brand()}<section class="screen"><span class="eyebrow">AI COACH · ถามทีละข้อ</span><h1>เล่าไอเดียให้โค้ชฟัง</h1><div class="chat-head"><div class="orb"></div><div><b>วันนี้จะทำคลิปอะไรดี?</b><small>โค้ชจะสรุปบรีฟให้ ก่อนพาไปสร้างวิดีโอ</small></div></div><div class="thread"><div class="bubble">สวัสดีครับ 👋 วันนี้อยากทำคลิปแบบไหน?</div><div class="bubble user">อยากทำ “${title}”</div><div class="bubble">ดีเลยครับ คนดูควรจำอะไรหรือทำอะไรต่อหลังดูจบ?</div></div><div class="chips">${Object.entries(intents).map(([key,[label]])=>`<button onclick="chooseIntent('${key}')">${label}</button>`).join('')}</div><div class="composer" style="margin-top:13px"><input aria-label="ไอเดียคลิป" placeholder="พิมพ์คำตอบสั้นๆ ได้เลย"><button class="send" onclick="notice('โค้ชรับคำตอบแล้ว → ถามคำถามถัดไป')">↑</button></div><button class="primary" onclick="notice('เปิด Preview Prompt Package ฟรี')">ดู Prompt Package ฟรี</button></section>${tabs('Coach')}</div>`; }
    function variantC() { const [title] = intents[state.intent]; const savedItems=marketItems.filter(item=>state.saved.has(item.id)); const ownedItems=marketItems.filter(item=>state.owned.has(item.id)&&item.price>0); return `<div class="shell">${brand()}<section class="screen"><span class="eyebrow">งานของฉัน</span><h1>ทำต่อจากตรงไหน?</h1><p>แยกไอเดียที่บันทึก, Prompt Packs ที่ซื้อ และงานที่กำลังทำให้ชัดเจน</p><div class="section-title"><b>บันทึกไว้</b><span>${savedItems.length} ไอเดีย</span></div>${savedItems.length?savedItems.map(item=>`<article class="draft"><b>${item.title}</b><p>${item.category} · ${item.price?item.price+' Coins':'ใช้ฟรี'}</p><footer><span>Saved Idea</span><button class="soft" onclick="goVariant('A')">เปิด Explore</button></footer></article>`).join(''):'<p>ยังไม่มีไอเดียที่บันทึกไว้</p>'}<div class="section-title"><b>Prompt Packs ของฉัน</b><span>${ownedItems.length} Packs</span></div>${ownedItems.length?ownedItems.map(item=>`<article class="draft orange"><b>${item.title}</b><p>ใช้เชิงพาณิชย์ได้ · เปิดใช้งานซ้ำได้</p><footer><span>เป็นเจ้าของแล้ว</span><button class="soft" onclick="useMarketItem('${item.id}')">เปิดใช้อีกครั้ง</button></footer></article>`).join(''):'<p>ยังไม่มี Prompt Pack ที่ซื้อ</p>'}<div class="section-title"><b>Studio Drafts</b><span>2 งาน</span></div><div class="timeline"><article class="draft"><b>คลิปขายกาแฟดริป</b><p>รอคุณตอบคำถามสุดท้ายกับ AI Coach</p><footer><span>Coach · 70%</span><button class="soft" onclick="goVariant('B')">ทำต่อ</button></footer></article><article class="draft orange"><b>รีวิวร้านชานม</b><p>มี Studio Draft พร้อมสร้างวิดีโอ</p><footer><span>🪙 85 Coins</span><button class="soft" onclick="notice('ไปยืนยันก่อนสร้างวิดีโอ')">ตรวจบรีฟ</button></footer></article></div><div class="new-draft"><span class="eyebrow">เริ่มงานใหม่</span><h2>สร้าง “${title}”</h2><p>เลือกต้นทางที่คุณมีอยู่แล้ว</p><div class="mode-row"><button onclick="goVariant('B')"><b>✍️</b>ข้อความ</button><button onclick="notice('เปิด Coach พร้อมรูป')"><b>🖼️</b>รูปเป็นวิดีโอ</button><button onclick="notice('เปิดโหมดขั้นสูง')"><b>🎞️</b>วิดีโอต่อยอด</button></div></div></section>${tabs('งานของฉัน')}</div>`; }
    function render() { document.body.classList.toggle('light', state.theme==='light'); document.getElementById('app').innerHTML = state.variant==='A' ? variantA() : state.variant==='B' ? variantB() : variantC(); document.getElementById('variant-label').innerHTML = `<b>${variants[state.variant]}</b><small>intent: ${intents[state.intent][0]} · LINE MINI App · ${state.theme}</small>`; }
    function chooseIntent(intent) { state.intent=intent; notice(`เลือก: ${intents[intent][0]}`); render(); }
    function setTab(tab) { state.tab=tab; if(tab==='Explore') goVariant('A'); else if(tab==='Coach') goVariant('B'); else if(tab==='งานของฉัน') goVariant('C'); else notice('Demo: โปรไฟล์และการตั้งค่า LINE'); }
    function setMarketFilter(filter) { state.marketFilter=filter; render(); }
    function applyMarketSearch() { const input=document.getElementById('market-search'); state.marketSearch=input?input.value:''; render(); }
    function toggleMarketSaved(id) { state.saved.has(id)?state.saved.delete(id):state.saved.add(id); render(); notice(state.saved.has(id)?'★ บันทึกไว้แล้ว':'นำออกจากบันทึกไว้แล้ว'); }
    function buyMarketItem(id) { const item=marketItems.find(entry=>entry.id===id); if(!item||item.price===0||state.owned.has(id)) return; if(state.coins<item.price){notice('Coins ไม่พอ · เปิด PromptPay Top-up');return;} state.coins-=item.price; state.owned.add(id); render(); notice(`ปลดล็อกแล้ว -${item.price} Coins`); }
    function useMarketItem(id) { const item=marketItems.find(entry=>entry.id===id); if(!item) return; const intentByCategory={'ขายสินค้า':'product','รีวิวร้าน':'review','เล่าเรื่อง':'story','คลิปความรู้':'knowledge','บริการ':'product','โปรโมชัน':'product'}; state.intent=intentByCategory[item.category]||'product'; goVariant('B'); notice(`ส่ง “${item.title}” เข้า AI Coach แล้ว`); }
    function toggleTheme() { state.theme=state.theme==='dark'?'light':'dark'; render(); notice(state.theme==='light'?'☀️ เปิด Light mode แล้ว':'🌙 กลับสู่ Dark mode แล้ว'); }
    function goVariant(key) { state.variant=key; history.replaceState({},'',`?variant=${key}`); render(); }
    function cycle(direction) { const keys=Object.keys(variants); const next=(keys.indexOf(state.variant)+direction+keys.length)%keys.length; goVariant(keys[next]); }
    function notice(text) { const toast=document.getElementById('toast'); toast.textContent=text; toast.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>toast.classList.remove('show'),1800); }
    addEventListener('keydown', event => { const tag=document.activeElement.tagName; if (['INPUT','TEXTAREA'].includes(tag) || document.activeElement.isContentEditable) return; if (event.key==='ArrowLeft') cycle(-1); if (event.key==='ArrowRight') cycle(1); });
    render();
  </script>
</body>
</html>
